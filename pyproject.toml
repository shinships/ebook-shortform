[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ebook-shortform"
version = "0.1.0"
description = "Dich va tom tat ebook tieng Anh (PDF/EPUB) sang tieng Viet, xuat EPUB"
requires-python = ">=3.10"
dependencies = [
    "google-genai>=1.0",
    "anthropic>=0.40",
    "ebooklib>=0.18",
    "pymupdf>=1.24",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "Pillow>=10.0",
]

[project.scripts]
ebook-translate = "ebook_translator.cli:main"
ebook-summarize = "ebook_translator.cli_summarize:main"

[tool.setuptools.packages.find]
where = ["src"]
