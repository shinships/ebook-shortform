# Cloudflare Tunnel cho máy chủ podcast riêng.
#
# Mục đích: đưa http://localhost:8000 ra HTTPS công khai tại podcast.homnayai.com.
# Bắt buộc phải là HTTPS — iOS chặn tải ảnh bìa qua HTTP thuần, và hạ tầng Apple
# không route được vào dải IP LAN 192.168.x.x. Đây chính là nguyên nhân khiến
# Apple Podcasts phát được tiếng nhưng không hiện ảnh bìa.
#
# Thiết lập một lần:
#   brew install cloudflared
#   cloudflared tunnel login
#   cloudflared tunnel create mit-podcast
#   cloudflared tunnel route dns mit-podcast podcast.homnayai.com
# Lệnh create in ra tunnel UUID và đường dẫn file credentials — điền vào bên dưới.
#
# Chạy thử:  cloudflared tunnel --config deploy/cloudflared/config.yml run
# Chạy nền:  cloudflared --config deploy/cloudflared/config.yml service install

tunnel: 64ce9904-8230-4947-8980-b3beb8e4565f
credentials-file: /Users/mktmda/.cloudflared/64ce9904-8230-4947-8980-b3beb8e4565f.json

# Không nén lại: MP3 và JPEG đã nén sẵn, nén thêm chỉ tốn CPU
no-autoupdate: true

ingress:
  - hostname: podcast.homnayai.com
    service: http://localhost:8000
    originRequest:
      # File MP3 sách nói khá lớn, nới thời gian chờ để tránh đứt giữa chừng
      connectTimeout: 30s
      # Giữ kết nối để Apple Podcasts tải nhiều tập liên tiếp không phải bắt tay lại
      keepAliveConnections: 16
      keepAliveTimeout: 90s
  # Bắt buộc phải có rule cuối cùng không kèm hostname
  - service: http_status:404
